set-option -g default-shell /bin/zsh

# ---- windows and panes ----
# numbering starts at 1, no gaps after closing one
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

setw -g mode-keys vi
set -g mouse on

unbind C-Space
set-option -g prefix C-b
bind-key C-b send-prefix

# without the prefix: Alt+1…9 go to a window, Alt+h/j/k/l to a pane,
# Shift+Alt+H/L or Alt+←/→ to the previous / next window
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-H previous-window
bind -n M-L next-window
bind -n M-Left previous-window
bind -n M-Right next-window

# resize: prefix then H/J/K/L, hold to repeat
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

# new windows and splits open in the current folder; | and - as well as " and %
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

bind r command-prompt -p "Rename window to:" "rename-window '%%'"
bind S command-prompt -p "Rename session to:" "rename-session '%%'"
bind F command-prompt -p "Find window:" "find-window '%%'"

# copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ---- pop-ups (close with q / Esc, or the same key) ----
# scratch shell, kept between uses
bind f if-shell -F '#{==:#{session_name},scratch}' {
    detach-client
  } {
      display-popup -E "tmux new-session -A -s scratch"
  }
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind b display-popup -E -w 90% -h 90% btop

# sessions: running sessions, project folders and recent folders (zoxide) in one list
bind o run-shell 'if command -v sesh >/dev/null; then sesh connect "$(sesh list --icons | fzf-tmux -p 70%,60% --no-sort --ansi --border-label " sessions " --prompt "  " --header "Enter: open · Ctrl+D: close session" --bind "ctrl-d:execute(tmux kill-session -t {2..})+reload(sesh list --icons)")"; else tmux display "Install sesh first: yay -S sesh-bin"; fi'

# prefix+M: tell me when this window stays quiet for 2 minutes (a long job finished or got
# stuck): a desktop flyout, once. Press again to stop watching. The window shows 󰂚 meanwhile.
bind M if -F '#{monitor-silence}' \
  'setw monitor-silence 0 ; display "Stopped watching this window"' \
  'setw monitor-silence 120 ; display "Watching: you get a flyout when it stays quiet for 2 min"'
set -g visual-silence off
set-hook -g alert-silence 'setw monitor-silence 0 ; run-shell -b "~/.config/tmux/quiet.sh \"#{session_name}\" \"#{window_name}\""'

# ---- look ----
# colours come from the wallpaper: wallust writes ~/.config/tmux/wallust.conf from
# .config/wallust/templates/colors-tmux.conf (re-sourced by hypr/scripts/WallustSwww.sh);
# these are only used until it exists
set -g @accent "#89b4fa"
set -g @surface "#1e1e2e"
set -g @muted "#6c7086"
set -g @fg "#E2E2E6"
set -g @alert "#f38ba8"
source-file -q ~/.config/tmux/wallust.conf

set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 80
# session name; turns the alert colour while the prefix is pressed
set -g status-left "#[fg=#{@surface},bg=#{?client_prefix,#{@alert},#{@accent}},bold] #{?client_prefix,󰘳 , }#S #[default] "
# 󰊓 zoomed pane · 󰂚 watched for quiet (prefix+M)
set -g window-status-format "#[fg=#{@muted}] #I #W#{?window_zoomed_flag, 󰊓,}#{?#{!=:#{monitor-silence},0}, 󰂚,} "
set -g window-status-current-format "#[fg=#{@surface},bg=#{@accent},bold] #I #W#{?window_zoomed_flag, 󰊓,}#{?#{!=:#{monitor-silence},0}, 󰂚,} #[default]"
set -g window-status-separator ""
# RAM and video memory (red when nearly full), then the time
set -g status-right "#[fg=#{@muted}]#(~/.config/tmux/stats.sh)  #[fg=#{@accent}]%H:%M "

# ---- plugins ----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
# prefix+u: every URL in the scrollback in a fuzzy list; Enter opens it in the browser
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @fzf-url-fzf-options '-p 70%,50% --prompt "  " --border-label " links " --multi -0 --no-preview'
# continuum last: it saves through status-right, and anything that sets status-right after
# it (a theme plugin did) silently stops all saves
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect / continuum: sessions saved every 10 min and brought back when tmux starts
# (after a reboot or a crash), with what was on screen in each pane
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# Graphics protocol passthrough (kitty icat, image.nvim, chafa -f kitty)
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
