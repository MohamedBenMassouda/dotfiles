### Aquamarine Environment Variables (Hyprland > 0.45) ###
# https://wiki.hyprland.org/Configuring/Environment-variables/#aquamarine-environment-variables
# env = AQ_TRACE,1 # Enables more verbose logging.
# env = AQ_DRM_DEVICES,/dev/dri/card1:/dev/dri/card0 # Set an explicit list of DRM devices (GPUs) to use. It’s a colon-separated list of paths, with the first being the primary. E.g. /dev/dri/card1:/dev/dri/card0
# env = AQ_MGPU_NO_EXPLICIT,1 # Disables explicit syncing on mgpu buffers
# env = AQ_NO_MODIFIERS,1 # Disables modifiers for DRM buffers

### Primary GPU ###
# Hybrid laptop: Intel UHD (pci 00:02.0) drives eDP-1, NVIDIA 1650Ti
# (pci 01:00.0) drives HDMI-A-1 @179Hz. With this unset, Aquamarine picked
# Intel as primary, so every frame for the 179Hz external display was rendered
# on the iGPU and copied across PCIe to the NVIDIA card. NVIDIA first = it
# renders for the display it already drives.
#
# Do NOT use /dev/dri/by-path/ names here. AQ_DRM_DEVICES is COLON-separated
# and those names contain colons (pci-0000:01:00.0-card), so Aquamarine splits
# them into fragments, finds no GPU, and the session fails to start. Only
# /dev/dri/cardN works.
#
# Managed by UserScripts/GpuPrimary.sh (SUPER ALT G), which resolves cardN from
# the fixed PCI addresses on every write. Takes effect at next login, never at
# runtime. If a session ever fails to start, delete the managed line below and
# Hyprland reverts to picking a GPU by enumeration order.


### Cursor theme ###
# hyprctl setcursor is runtime-only and is lost on every restart. These env
# vars are what actually make it stick: Hyprland's own cursor, XWayland, and
# most toolkits read them at launch. Kept in sync with ~/.icons/default,
# gsettings, and the gtk settings.ini files.
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24
# HYPRCURSOR_THEME deliberately unset: the only hyprcursor-format theme
# installed is Bibata-Original-Ice, not -Modern-. Pointing it at a missing
# theme makes Hyprland fall back unpredictably. Install a hyprcursor build of
# Bibata-Modern-Ice first if you want the native path.
env = HYPRCURSOR_SIZE,24
env = AQ_DRM_DEVICES,/dev/dri/card1:/dev/dri/card2
