# Commands and Apps to be executed at launch

# Spotify (flatpak). WindowRules.conf already sends class ^(Spotify)$ to
# workspace 3 silently, so this starts in the background without stealing focus.
exec-once = flatpak run com.spotify.Client

# Cursor. The XCURSOR_* env vars in ENVariables.conf are what make this
# persist; this line only covers Hyprland's live cursor for the current
# session, since some sequences reset it after the env is read.
exec-once = hyprctl setcursor Bibata-Modern-Ice 24

# Track-change notifications with album art (Spotify sends none of its own).
exec-once = $UserScripts/MusicNotify.sh

