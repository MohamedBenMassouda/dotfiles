# Bluetooth headset mics (WH-CH720N, controllers...) don't become the default
# input on their own when they connect: their call-quality mic also drops the
# headphones to low-quality audio. They stay in the device list
# (quick settings, SUPER+ALT+A) to pick by hand.
monitor.bluez.rules = [
  {
    matches = [ { media.class = "Audio/Source" } ]
    actions = { update-props = { priority.session = 500, priority.driver = 500 } }
  }
]
