# Bluetooth headsets start in the best-sounding profile: AAC, then SBC-XQ, SBC.
# While an app uses the headset mic, WirePlumber switches to headset mode
# (bluetooth.autoswitch-to-headset-profile, on by default) and switches back
# when the mic is released. Headset mode prefers mSBC over CVSD (better calls).
# Manual switching: quick settings > Bluetooth > your headphones
# (hypr/scripts/BtProfile.sh, not remembered, so this stays the default).
device.profile.priority.rules = [
  {
    matches = [
      {
        device.name = "~bluez_card.*"
      }
    ]
    actions = {
      update-props = {
        # first = preferred
        priorities = [
          "a2dp-sink"
          "a2dp-sink-sbc_xq"
          "a2dp-sink-sbc"
          "headset-head-unit"
          "headset-head-unit-cvsd"
        ]
      }
    }
  }
]
