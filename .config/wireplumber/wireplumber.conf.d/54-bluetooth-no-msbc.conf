# This laptop's Realtek Bluetooth chip (0bda:b00c) fails wideband (mSBC) call
# audio: switching a headset to its mic profile gave silence ("Failure in
# Bluetooth audio transport", kernel "SCO packet for unknown connection
# handle"). Plain CVSD works, so headset/call mode uses that.
monitor.bluez.properties = {
  bluez5.enable-msbc = false
}
