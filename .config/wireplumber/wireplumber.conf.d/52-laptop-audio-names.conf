# The laptop's sound card has both the built-in mic/speakers and the headphone
# jack; apps (Discord, browsers) only see the card, named "Built-in Audio Analog
# Stereo" either way. Clearer names; the hardware switches to the jack by itself
# when something is plugged in.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_input.pci-0000_00_1f.3.analog-stereo" } ]
    actions = { update-props = { node.description = "Laptop mic / headset jack", node.nick = "Laptop mic / jack" } }
  }
  {
    matches = [ { node.name = "alsa_output.pci-0000_00_1f.3.analog-stereo" } ]
    actions = { update-props = { node.description = "Laptop speakers / headphone jack", node.nick = "Laptop speakers / jack" } }
  }
]
