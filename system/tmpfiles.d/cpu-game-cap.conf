# Lets the wheel group cap the CPU's top speed: game mode (hypr/scripts/GameMode.sh) sets it
# to 80% while a game runs so the laptop stays cooler (it reached 89°C) at almost no FPS
# cost, and back to 100% after.
# Install: sudo cp system/tmpfiles.d/cpu-game-cap.conf /etc/tmpfiles.d/ && sudo systemd-tmpfiles --create /etc/tmpfiles.d/cpu-game-cap.conf
z /sys/devices/system/cpu/intel_pstate/max_perf_pct 0664 root wheel - -
