# /etc/systemd/system/user@.service.d/10-oomd.conf (installed by system/finish-setup.sh)
# When memory runs short, systemd-oomd closes the app using the most memory (each app runs
# in its own unit through uwsm), instead of the whole desktop freezing until a hard restart.
[Service]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=60%
